name: Wetterdaten aktualisieren

# Holt einmal täglich die neuen Werte und veröffentlicht die Seite neu.
# Die Historie wird jedes Mal frisch aus dem Open-Meteo-Archiv aufgebaut,
# es gibt also keinen Zustand, der auseinanderlaufen könnte.
#
# Der Schreibschritt am Ende ist kein Selbstzweck: GitHub schaltet geplante
# Workflows nach 60 Tagen ohne Repository-Aktivität ab. Der tägliche Commit
# des Datenstands hält den Zeitplan am Leben – und hinterlässt nebenbei eine
# nachvollziehbare Historie, wann welcher Stand veröffentlicht wurde.

on:
  schedule:
    - cron: '30 5 * * *'   # täglich 05:30 UTC = 07:30 Berlin (Sommerzeit)
  workflow_dispatch:        # zusätzlich jederzeit von Hand startbar

permissions:
  contents: write   # für den täglichen Commit des Datenstands
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Daten holen
        run: npm run update

      - name: Seite erzeugen
        run: npm run site

      - name: Datenstand festschreiben
        run: |
          cp public/daten/*.json data/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Änderung am Datenstand."
          else
            git commit -m "Datenstand $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
